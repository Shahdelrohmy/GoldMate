openapi: 3.0.3
info:
  title: GoldMate API
  version: 0.1.0
  description: |
    DRAFT starter for Week 2. The Team Lead refines it in Week 1 and the pairs agree the details on Saturday of each week.
    Conventions: money is an integer in piasters (1 EGP = 100 piasters), weights are grams with 3 decimals,
    dates are ISO 8601. Every price is an estimate and the response says so.
    Open items: (1) the 8 Vault definitions and the spread semantics (percent of price, see VaultSummary) wait for team approval;
    (2) buy-sell and break-even calculator shapes are PROPOSED, B2 + M2 confirm them on Saturday of Week 2.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /me:
    get:
      summary: Who is signed in (id and role). Also the quickest way to test a token.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [id, role]
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [individual, shop, admin] }
        "401": { $ref: "#/components/responses/Error" }

  /prices/latest:
    get:
      summary: Latest gold prices (estimate), after the Admin spread
      responses:
        "200":
          description: Latest snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceSnapshot" }
        default: { $ref: "#/components/responses/Error" }

  /prices/history:
    get:
      summary: Price history for one karat
      parameters:
        - name: karat
          in: query
          required: true
          schema: { type: integer, enum: [24, 21, 18] }
        - name: range
          in: query
          required: true
          schema: { type: string, enum: [1W, 1M, 3M, 1Y] }
      responses:
        "200":
          description: Points in time order
          content:
            application/json:
              schema:
                type: object
                required: [karat, points]
                properties:
                  karat: { type: integer }
                  points:
                    type: array
                    items:
                      type: object
                      required: [at, gram_price_piasters]
                      properties:
                        at: { type: string, format: date-time }
                        gram_price_piasters: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Error" }

  /vault/records:
    get:
      summary: List the signed-in user's Gold Records
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoldRecord" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Add a Gold Record (manual entry in Month 1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoldRecordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoldRecord" }
        default: { $ref: "#/components/responses/Error" }

  /vault/records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one record
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoldRecord" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      summary: Update a record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoldRecordInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoldRecord" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a record
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /vault/summary:
    get:
      summary: The 8 Vault calculations
      responses:
        "200":
          description: Summary (all values are estimates)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultSummary" }
        default: { $ref: "#/components/responses/Error" }

  /zakat/status:
    get:
      summary: Zakat status for the signed-in user
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZakatStatus" }
        default: { $ref: "#/components/responses/Error" }

  /calculators/buy-sell:
    post:
      summary: Buy/Sell calculator (PROPOSED shape, B2 + M2 confirm)
      description: |
        Buy total = pure weight x karat price + optional making charge.
        Sell total = pure weight x karat price after the Admin spread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight_g, karat]
              properties:
                weight_g: { type: number, minimum: 0.001 }
                karat: { type: integer, enum: [24, 21, 18] }
                making_charge_piasters: { type: integer, format: int64, minimum: 0, nullable: true }
      responses:
        "200":
          description: Result (estimate)
          content:
            application/json:
              schema:
                type: object
                required: [gram_price_piasters, buy_total_piasters, sell_total_piasters, spread_pct, is_estimate]
                properties:
                  gram_price_piasters: { type: integer, format: int64, description: "Price per gram of the chosen karat" }
                  buy_total_piasters: { type: integer, format: int64 }
                  sell_total_piasters: { type: integer, format: int64 }
                  spread_pct: { type: number }
                  is_estimate: { type: boolean, example: true }
        default: { $ref: "#/components/responses/Error" }

  /calculators/break-even:
    post:
      summary: Break-even calculator for one purchase (PROPOSED shape, B2 + M2 confirm)
      description: The 24K gram price at which selling (after the spread) returns the purchase price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight_g, karat, purchase_price_piasters]
              properties:
                weight_g: { type: number, minimum: 0.001 }
                karat: { type: integer, enum: [24, 21, 18] }
                purchase_price_piasters: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Result (estimate)
          content:
            application/json:
              schema:
                type: object
                required: [break_even_gram24_piasters, current_gram24_piasters, difference_piasters, is_estimate]
                properties:
                  break_even_gram24_piasters: { type: integer, format: int64 }
                  current_gram24_piasters: { type: integer, format: int64 }
                  difference_piasters: { type: integer, format: int64, description: "break-even minus current; positive = the price still has to rise" }
                  is_estimate: { type: boolean, example: true }
        default: { $ref: "#/components/responses/Error" }

  /calculators/making-charge:
    post:
      summary: Making Charges calculator (matches what the mobile screen already sends and shows)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight_g, karat, total_price_piasters]
              properties:
                weight_g: { type: number, minimum: 0.001 }
                karat: { type: integer, enum: [24, 21, 18] }
                total_price_piasters: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Result (estimate). total_making is never negative.
          content:
            application/json:
              schema:
                type: object
                required: [gold_value_piasters, total_making_piasters, making_per_gram_piasters, is_estimate]
                properties:
                  gold_value_piasters: { type: integer, format: int64 }
                  total_making_piasters: { type: integer, format: int64 }
                  making_per_gram_piasters: { type: integer, format: int64 }
                  is_estimate: { type: boolean, example: true }
        default: { $ref: "#/components/responses/Error" }

  /price-check:
    post:
      summary: Price Reasonableness Check (coins and bars only, F-16). Calculation, not AI.
      description: |
        Compares the making charge percentage with the usual range for the same type and weight (table `price_ranges`).
        Returns 404 `no_range` when no range exists for that type and weight yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [piece_type, karat, weight_g, total_price_piasters]
              properties:
                piece_type: { type: string, enum: [coin, bar] }
                karat: { type: integer, enum: [24, 21, 18] }
                weight_g: { type: number, minimum: 0.001 }
                total_price_piasters: { type: integer, format: int64, minimum: 0 }
                making_charge_piasters: { type: integer, format: int64, minimum: 0, nullable: true, description: "If omitted, it is computed as price minus gold value" }
      responses:
        "200":
          description: Result (not a judgment on the shop)
          content:
            application/json:
              schema:
                type: object
                required: [status, making_pct, range_min_pct, range_max_pct]
                properties:
                  status: { type: string, enum: [ok, high, low], description: "ok = reasonable, high = higher than usual, low = much lower than usual (double-check karat and weight)" }
                  making_pct: { type: number }
                  range_min_pct: { type: number }
                  range_max_pct: { type: number }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }

    PriceSnapshot:
      type: object
      required: [fetched_at, ounce_usd, usd_egp, gram_price_piasters, is_estimate]
      properties:
        fetched_at: { type: string, format: date-time }
        ounce_usd: { type: number }
        usd_egp: { type: number }
        gram_price_piasters:
          type: object
          required: ["24", "21", "18"]
          description: Price per gram by karat, in piasters
          properties:
            "24": { type: integer, format: int64 }
            "21": { type: integer, format: int64 }
            "18": { type: integer, format: int64 }
        source: { type: string, enum: [api, manual] }
        is_estimate: { type: boolean, example: true }

    GoldRecordInput:
      type: object
      required: [piece_type, karat, weight_g, price_piasters, purchased_on]
      properties:
        piece_type: { type: string, enum: [coin, bar, jewelry] }
        karat: { type: integer, enum: [24, 21, 18] }
        weight_g: { type: number, minimum: 0.001 }
        price_piasters: { type: integer, format: int64, minimum: 0 }
        making_charge_piasters: { type: integer, format: int64, minimum: 0, nullable: true }
        purchased_on: { type: string, format: date }
        shop_name: { type: string, nullable: true }
        invoice_image_path: { type: string, nullable: true }

    GoldRecord:
      allOf:
        - $ref: "#/components/schemas/GoldRecordInput"
        - type: object
          required: [id, source, created_at]
          properties:
            id: { type: string, format: uuid }
            source: { type: string, enum: [manual, ai_extracted_reviewed, shop_verified] }
            created_at: { type: string, format: date-time }

    VaultSummary:
      type: object
      description: |
        The 8 calculations. Definitions are proposed, pending team approval (see services/api/src/domain/vault.ts).
        The spread is a percent of the price (OPEN DECISION: percent vs fixed EGP per gram).
      required:
        - total_weight_g
        - pure_weight_g
        - total_invested_piasters
        - average_cost_per_gram_piasters
        - current_value_piasters
        - selling_value_piasters
        - profit_loss_piasters
        - break_even_price_per_gram_piasters
        - is_estimate
      properties:
        total_weight_g: { type: number }
        pure_weight_g: { type: number, description: "24K equivalent" }
        total_invested_piasters: { type: integer, format: int64 }
        average_cost_per_gram_piasters: { type: integer, format: int64, nullable: true }
        current_value_piasters: { type: integer, format: int64 }
        selling_value_piasters: { type: integer, format: int64, description: "After the Admin spread" }
        profit_loss_piasters: { type: integer, format: int64 }
        break_even_price_per_gram_piasters: { type: integer, format: int64, nullable: true }
        return_pct: { type: number, nullable: true, description: "Profit/loss as % of the invested amount; null when nothing is invested" }
        is_estimate: { type: boolean, example: true }

    ZakatStatus:
      type: object
      required: [pure_weight_g, nisab_g, above_nisab]
      properties:
        pure_weight_g: { type: number }
        nisab_g: { type: number, description: "From app_settings (85)" }
        above_nisab: { type: boolean }
        hawl_start_gregorian: { type: string, format: date, nullable: true }
        hawl_start_hijri: { type: string, nullable: true, example: "1448-05-12" }
        days_remaining: { type: integer, nullable: true }
        zakat_due_piasters: { type: integer, format: int64, nullable: true }
        disclaimer: { type: string, description: "This is a calculation aid, not a fatwa" }
